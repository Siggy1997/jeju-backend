<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>단어시험</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>

    <style>
        @page {
            size: A4;
            margin: 0mm;
        }

        body {
            margin: 0;
            background: #e5e5e5;
        }

        .paper {
            position: relative;
            width: 210mm;
            height: 297mm;
            background: white;
            margin: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, .25);
        }

        #pdfCanvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 210mm;
            height: 297mm;
        }

        .tables {
            position: absolute;
            left: 50%;
            top: 66.2mm;
            width: 172.04mm;
            transform: translateX(-50%);
            display: flex;
        }

        .form-table {
            width: 50%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 10pt;
            font-family: "HCR Batang", "한컴바탕", serif;
            font-weight: bold;
        }

        .form-table td {
            height: 9.8mm;
            padding: 0 1px;
            text-align: center;
            vertical-align: middle;
        }

        .form-table.left td:last-child {
            border-right: 0;
        }

        .form-table col.c1 {
            width: 8.78mm;
        }

        .form-table col.c2 {
            width: 33.63mm;
        }

        .form-table col.c3 {
            width: 43.61mm;
        }

        .answer {
            font-size: 8pt;
        }

        @media print {
            @page {
                size: A4;
                margin: 0mm;
            }

            html,
            body {
                width: 210mm;
                height: 297mm;
                overflow: hidden;
                background: white;
            }

            .no-print,
            nav,
            footer,
            button {
                display: none !important;
            }

            .paper {
                box-shadow: none;
                margin: 0;
                page-break-after: avoid;
                page-break-inside: avoid;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
            }

            .print-area {
                display: block;
                width: 100%;
            }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fff;
            margin: 1% auto;
            padding: 20px;
            width: 746px;
            border-radius: 5px;
            text-align: center;
            height: 583px;
        }

        .modal-content button {
            margin: 5px;
        }

        .modal-btn {
            background-color: #933030;
            border: none;
            padding: 5px 10px;
            width: 94%;
            color: white;
            border-radius: 9px;
            font-size: 18px;
        }

        .btn {
            background-color: #933030;
            border: none;
            padding: 5px 10px;
            color: white;
            border-radius: 9px;
            font-size: 14px;
        }

        .day-item.selected {
            background-color: #933030;
            color: white;
        }

        #selected-days {
            position: absolute;
            left: 49%;
            top: 24.5mm;
            width: 25.04mm;
            font-size: 9.5pt;
            font-family: "HCR Batang", "한컴바탕", serif;
            font-weight: lighter;
        }

        #input-grade {
            position: absolute;
            left: 48.7%;
            top: 31.8mm;
            width: 25.04mm;
            font-size: 9.5pt;
            font-family: "HCR Batang", "한컴바탕", serif;
            font-weight: lighter;
            border: none;
            padding: 0;
        }

        #input-grade::placeholder {
            color: #f81919;
            font-weight: 800;
        }
    </style>
</head>

<body>
    <!-- 모달 -->
    <div id="dayModal" class="modal">
        <div class="modal-content">
            <div style="color: #933030;font-size: 33px;font-weight: 800;margin-bottom: 15px;">DAY 선택</div>
            <div style="display:flex; flex-wrap: wrap; justify-content:center; user-select:none;" id="day-items-container">
                <!-- JS로 생성됨 -->
            </div>
            <br>
            <button class="modal-btn" id="submitDays" style="padding: 10px 10px">확인</button>
            <button class="modal-btn" onclick="hideModal()" style="background-color: white; color: black;">취소</button>
        </div>
    </div>

    <div class="no-print"
        style="margin: auto; width: 210mm;padding: 20px 0; display: flex; justify-content: space-between;">
        <div>
            <button class="btn" type="button" onclick="showModal()">날짜 선택</button>
            <button class="btn" id="refreshBtn" type="button">새로고침</button>
        </div>
        <div>
            <button class="btn" onclick="forStudent()">학생용</button>
            <button class="btn" onclick="forTeacher()">선생용</button>
            <button class="btn" onclick="doPrint()">프린트</button>
        </div>
    </div>

    <div class="paper">
        <canvas id="pdfCanvas"></canvas>
        <div id="selected-days">Day</div>
        <input id="input-grade" type="text" placeholder="입력하세요">
        <div class="tables">
            <table class="form-table left">
                <colgroup>
                    <col class="c1">
                    <col class="c2">
                    <col class="c3">
                </colgroup>
                <tbody id="leftTableBody"></tbody>
            </table>
            <table class="form-table">
                <colgroup>
                    <col class="c1">
                    <col class="c2">
                    <col class="c3">
                </colgroup>
                <tbody id="rightTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // DAY 선택 아이템 생성 (JSP <c:forEach> 대체)
        const container = document.getElementById('day-items-container');
        for (let d = 1; d <= 50; d++) {
            const div = document.createElement('div');
            div.className = 'day-item';
            div.dataset.value = d;
            div.style.cssText = "width:50px; margin:5px; text-align:center; padding:5px; border:1px solid #ccc; cursor:pointer;";
            div.innerHTML = `<div style="font-size: 17px; font-weight: 900;">${d}</div>
                             <span style="font-size: 13px; font-weight: 700;">DAY</span>`;
            container.appendChild(div);
        }

        // PDF 렌더링
        const url = "/testForm.pdf";
        pdfjsLib.getDocument(url).promise.then(pdf => {
            pdf.getPage(1).then(page => {
                const viewport = page.getViewport({ scale: 2 });
                const canvas = document.getElementById("pdfCanvas");
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                page.render({ canvasContext: canvas.getContext("2d"), viewport });
            });
        });

        let selected = [];
        const selectedDaysDiv = document.getElementById('selected-days');
        const dayItems = document.querySelectorAll('.day-item');
        const submitBtn = document.getElementById('submitDays');
        const modal = document.getElementById('dayModal');

        dayItems.forEach(div => {
            div.addEventListener('click', () => {
                const val = Number(div.dataset.value);

                if (selected.includes(val)) {
                    selected = selected.filter(v => v !== val);
                    div.classList.remove('selected');
                } else {
                    selected.push(val);
                    div.classList.add('selected');
                }

                if (selected.length > 0) {
                    const sorted = selected.slice().sort((a, b) => a - b);
                    const min = sorted[0];
                    const max = sorted[sorted.length - 1];
                    selectedDaysDiv.textContent = "Day   " + min + " ~ " + max;
                } else {
                    selectedDaysDiv.textContent = 'Day';
                }
            });
        });

        function showModal() { modal.style.display = 'block'; }
        function hideModal() { modal.style.display = 'none'; }

        function renderVocabTables(vocabList) {
            const leftBody = document.getElementById('leftTableBody');
            const rightBody = document.getElementById('rightTableBody');
            leftBody.innerHTML = '';
            rightBody.innerHTML = '';

            vocabList.forEach((w, index) => {
                const tr = document.createElement('tr');

                const td1 = document.createElement('td'); td1.textContent = '';
                const td2 = document.createElement('td'); td2.className = 'vocab'; td2.textContent = w.vocab;
                const td3 = document.createElement('td'); td3.className = 'answer'; td3.textContent = w.meaning;

                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);

                if (index < 20) leftBody.appendChild(tr);
                else rightBody.appendChild(tr);
            });
        }

        submitBtn.addEventListener('click', () => {
            if (selected.length === 0) return alert('선택된 DAY가 없습니다!');
            fetch('/testForm/submitDays', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days: selected })
            })
                .then(res => res.json())
                .then(result => {
                    console.log('서버 응답:', result);
                    hideModal();
                    if (result.result) renderVocabTables(result.result);
                })
                .catch(err => console.error('AJAX 오류:', err));
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            if (selected.length === 0) return alert('선택된 DAY가 없습니다!');
            fetch('/testForm/submitDays', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days: selected })
            })
                .then(res => res.json())
                .then(result => {
                    console.log('서버 응답:', result);
                    hideModal();
                    if (result.result) renderVocabTables(result.result);
                })
                .catch(err => console.error('AJAX 오류:', err));
        });

        function forStudent() {
            document.querySelectorAll('.answer').forEach(el => el.style.visibility = 'hidden');
        }

        function forTeacher() {
            document.querySelectorAll('.answer').forEach(el => el.style.visibility = 'visible');
        }

        function doPrint() {
            window.print();
        }
    </script>
</body>
</html>
