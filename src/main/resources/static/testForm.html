<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>단어시험</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=DM+Serif+Display&family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">

	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
	<script>
		pdfjsLib.GlobalWorkerOptions.workerSrc =
			"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
	</script>

	<style>
		:root {
			--red: #8B2020;
			--red-light: #b03030;
			--red-pale: #fdf0f0;
			--ink: #1a1008;
			--gray: #6b6560;
			--border: #d4c8c0;
			--bg: #f5f0eb;
		}

		@page { size: A4; margin: 0mm; }
		* { box-sizing: border-box; }
		html { touch-action: manipulation; }

		body {
			margin: 0;
			background: var(--bg);
			font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
			min-height: 100vh;
		}

		/* ── 컨트롤 바 ── */
		.control-bar {
			width: 210mm;
			margin: 0 auto;
			padding: 14px 0 10px;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 8px;
		}

		.ctrl-group {
			display: flex;
			align-items: center;
			gap: 6px;
			background: white;
			border-radius: 12px;
			padding: 6px 10px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.07);
			border: 1px solid var(--border);
			flex-shrink: 0;
		}

		.ctrl-label {
			font-size: 10px;
			font-weight: 700;
			color: var(--gray);
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.seg-wrap {
			display: flex;
			gap: 3px;
			background: var(--bg);
			border-radius: 8px;
			padding: 3px;
		}

		.seg-btn {
			font-family: 'Pretendard', sans-serif;
			font-size: 11px;
			font-weight: 600;
			padding: 4px 10px;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			background: transparent;
			color: var(--gray);
			transition: all 0.18s;
			white-space: nowrap;
		}
		.seg-btn.active {
			background: var(--red);
			color: white;
			box-shadow: 0 2px 6px rgba(139,32,32,0.3);
		}
		.seg-btn:hover:not(.active) {
			background: rgba(139,32,32,0.08);
			color: var(--red);
		}

		.btn {
			font-family: 'Pretendard', sans-serif;
			font-size: 12px;
			font-weight: 700;
			padding: 7px 14px;
			border: none;
			border-radius: 9px;
			cursor: pointer;
			transition: all 0.18s;
			letter-spacing: -0.01em;
		}
		.btn-primary {
			background: var(--red);
			color: white;
			box-shadow: 0 2px 8px rgba(139,32,32,0.25);
		}
		.btn-primary:hover { background: var(--red-light); transform: translateY(-1px); }
		.btn-ghost {
			background: white;
			color: var(--ink);
			border: 1px solid var(--border);
		}
		.btn-ghost:hover { border-color: var(--red); color: var(--red); }

		.spacer { flex: 1; }

		.status-badge {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			font-size: 11px;
			font-weight: 600;
			color: var(--gray);
			background: white;
			border: 1px solid var(--border);
			border-radius: 20px;
			padding: 4px 10px;
			flex-shrink: 0;
		}
		.status-dot {
			width: 7px; height: 7px;
			border-radius: 50%;
			background: #ccc;
			transition: background 0.3s;
		}
		.status-dot.active { background: #2ecc71; }

		/* ── 인쇄 용지 ── */
		.paper-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
			padding-bottom: 20px;
		}
		.paper {
			position: relative;
			width: 210mm;
			height: 297mm;
			background: white;
			margin: auto;
			box-shadow: 0 8px 48px rgba(0,0,0,0.18);
			border-radius: 2px;
			overflow: hidden;
		}
		#pdfCanvas {
			position: absolute;
			left: 0; top: 0;
			width: 210mm; height: 297mm;
		}
		.tables {
			position: absolute;
			left: 50%;
			top: 66.2mm;
			width: 172.04mm;
			transform: translateX(-50%);
			display: flex;
		}
		.form-table {
			width: 50%;
			border-collapse: collapse;
			table-layout: fixed;
			font-size: 9pt;
			font-family: "HCR Batang", "한컴바탕", serif;
			font-weight: bold;
		}
		.form-table td {
			height: 9.8mm;
			padding: 0 1px;
			text-align: center;
			vertical-align: middle;
		}
		.form-table.left td:last-child { border-right: 0; }
		.form-table col.c1 { width: 8.78mm; }
		.form-table col.c2 { width: 33.63mm; }
		.form-table col.c3 { width: 43.61mm; }
		.answer { font-size: 8pt; }

		#selected-days {
			position: absolute;
			left: 49%; top: 24.5mm;
			width: 25.04mm;
			font-size: 9.5pt;
			font-family: "HCR Batang", "한컴바탕", serif;
			font-weight: lighter;
		}
		#input-grade {
			position: absolute;
			left: 48.7%; top: 32mm;
			width: 25.04mm;
			font-size: 9.5pt;
			font-family: "HCR Batang", "한컴바탕", serif;
			font-weight: lighter;
			border: none;
			padding: 0;
			background: transparent;
			outline: none;
		}
		#input-grade::placeholder { color: #f81919; font-weight: 800; }

		/* ── 모달 공통 ── */
		.modal {
			display: none;
			position: fixed;
			z-index: 1000;
			inset: 0;
			background: rgba(10,5,0,0.55);
			backdrop-filter: blur(4px);
			align-items: center;
			justify-content: center;
		}
		.modal.open { display: flex; }

		.modal-box {
			background: white;
			border-radius: 20px;
			padding: 32px 28px 24px;
			box-shadow: 0 24px 80px rgba(0,0,0,0.25);
			max-height: 90vh;
			overflow-y: auto;
			scrollbar-width: none;
		}
		.modal-box::-webkit-scrollbar { display: none; }

		.modal-title {
			font-family: 'DM Serif Display', serif;
			font-size: 28px;
			color: var(--red);
			margin: 0 0 20px;
			text-align: center;
			letter-spacing: -0.02em;
		}

		/* DAY 그리드 */
		.day-grid {
			display: grid;
			grid-template-columns: repeat(10, 52px);
			gap: 6px;
			justify-content: center;
			margin-bottom: 20px;
		}
		.day-item {
			width: 52px; height: 52px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			border: 1.5px solid var(--border);
			border-radius: 10px;
			cursor: pointer;
			transition: all 0.15s;
			user-select: none;
			background: white;
		}
		.day-item:hover { border-color: var(--red); background: var(--red-pale); }
		.day-item.selected {
			background: var(--red);
			border-color: var(--red);
			color: white;
			box-shadow: 0 3px 10px rgba(139,32,32,0.35);
		}
		.day-num { font-size: 16px; font-weight: 900; line-height: 1; font-family: 'DM Serif Display', serif; }
		.day-label { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; opacity: 0.7; margin-top: 2px; }
		.day-item.selected .day-label { opacity: 0.85; }

		.modal-actions { display: flex; gap: 8px; margin-top: 8px; }
		.modal-actions .btn { flex: 1; padding: 12px; font-size: 14px; border-radius: 12px; }

		/* 자세히보기 테이블 */
		.detail-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
		}
		.detail-table th {
			background: var(--red);
			color: white;
			padding: 8px 6px;
			font-weight: 700;
			font-size: 11px;
			letter-spacing: 0.04em;
		}
		.detail-table td {
			padding: 6px;
			border-bottom: 1px solid #f0e8e0;
			text-align: center;
		}
		.detail-table tr:hover td { background: var(--red-pale); }
		[contenteditable]:focus { outline: 2px solid var(--red); border-radius: 3px; }

		/* 카드 (모바일) - 기본 숨김 */
		.detail-card-list { display: none; }
		.detail-card {
			background: #fdf8f5;
			border: 1px solid #e8ddd5;
			border-radius: 12px;
			padding: 10px 14px;
			display: grid;
			grid-template-columns: 28px 1fr 1fr auto;
			align-items: center;
			gap: 8px;
		}
		.dc-num { font-size: 11px; color: #999; font-weight: 700; text-align: center; }
		.dc-vocab { font-weight: 700; color: var(--ink); font-size: 13px; }
		.dc-meaning { color: #555; font-size: 12px; }
		.dc-type {
			font-size: 10px; font-weight: 700;
			padding: 2px 6px; border-radius: 6px;
			background: var(--red-pale); color: var(--red);
			white-space: nowrap;
		}



		/* ── 모바일 ── */
		@media screen and (max-width: 800px) {
			body { background: #f0ebe4; }

			.control-bar {
				width: 100%;
				padding: 10px 10px 8px;
				gap: 6px;
			}
			.ctrl-group { padding: 5px 8px; border-radius: 10px; }
			.ctrl-label { font-size: 9px; }
			.seg-btn { font-size: 10px; padding: 4px 8px; }
			.btn { font-size: 11px; padding: 5px 10px; }
			.spacer { display: none; }
			.status-badge { margin-left: auto; font-size: 10px; padding: 3px 8px; }
			.paper-wrap { padding-bottom: 16px; }

			/* DAY 모달 */
			.modal-box {
				width: 95vw !important;
				padding: 20px 14px 16px;
				border-radius: 16px;
				max-height: 88vh;
			}
			.modal-title { font-size: 20px; margin-bottom: 14px; }
			.day-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
			.day-item { width: 100%; height: 44px; border-radius: 8px; }
			.day-num { font-size: 13px; }
			.day-label { font-size: 8px; }
			.modal-actions .btn { font-size: 13px; padding: 10px; }

			/* 자세히보기 - 전체화면 바텀시트 */
			#detailModal .modal-box {
				width: 100vw !important;
				height: 100dvh;
				max-height: 100dvh;
				border-radius: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
			}
			#detailModal .modal-title {
				font-size: 18px;
				padding: 20px 16px 0;
				margin-bottom: 12px;
				flex-shrink: 0;
			}
			#detailModal .detail-table { display: none; }
			#detailModal br { display: none; }
			.detail-card-list {
				display: flex;
				flex-direction: column;
				flex: 1;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
				padding: 0 12px 8px;
				gap: 7px;
			}
			#detailModal .close-btn {
				margin: 8px 12px 20px;
				flex-shrink: 0;
				width: calc(100% - 24px);
				padding: 13px;
				font-size: 14px;
				border-radius: 12px;
			}

			/* 시험 모달 모바일 */
			#quizModal .modal-box {
				width: 100vw !important;
				height: 100dvh;
				max-height: 100dvh;
				border-radius: 0 !important;
				padding: 16px 14px 12px !important;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			#quizModal .quiz-header {
				flex-shrink: 0;
				margin-bottom: 10px;
				flex-wrap: wrap;
				gap: 6px;
			}
			#quizModal .quiz-title { font-size: 16px; }
			#quizModal .quiz-count { font-size: 11px; }
			#quizModal #quizCardArea {
				flex: 1;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
				min-height: 0;
			}
			#quizModal .quiz-card {
				padding: 18px 16px 14px;
				border-radius: 14px;
				margin-bottom: 0;
			}
			#quizModal .quiz-nav {
				flex-shrink: 0;
				padding-top: 10px;
				padding-bottom: env(safe-area-inset-bottom, 0px);
			}
			#quizModal .quiz-result {
				flex: 1;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
			}
			.quiz-question { font-size: 22px; }
			.result-score { font-size: 48px; }
			.result-row {
				grid-template-columns: 22px 1fr 1fr auto;
				font-size: 11px;
				padding: 6px 10px;
				gap: 6px;
			}
			.r-ans { font-size: 11px; }
		}
	
		/* ── 시험 모드 ── */
		.quiz-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 16px;
			gap: 8px;
			flex-wrap: nowrap;
		}
		.quiz-title {
			font-family: 'DM Serif Display', serif;
			font-size: 22px;
			color: var(--red);
			font-weight: 900;
		}
		.quiz-progress-wrap {
			flex: 1;
			height: 6px;
			background: var(--border);
			border-radius: 99px;
			overflow: hidden;
		}
		.quiz-progress-bar {
			height: 100%;
			background: var(--red);
			border-radius: 99px;
			transition: width 0.3s ease;
			width: 0%;
		}
		.quiz-count {
			font-size: 12px;
			font-weight: 700;
			color: var(--gray);
			white-space: nowrap;
		}

		.quiz-card {
			background: white;
			border-radius: 20px;
			padding: 36px 40px 28px;
			box-shadow: 0 4px 32px rgba(139,32,32,0.10);
			border: 1px solid var(--border);
			margin-bottom: 12px;
			transition: border-color 0.2s;
		}
		.quiz-card.correct  { border-color: #2ecc71; background: #f0fff6; }
		.quiz-card.wrong    { border-color: #e74c3c; background: #fff5f5; }

		.quiz-question-label {
			font-size: 10px;
			font-weight: 700;
			color: var(--gray);
			letter-spacing: 0.1em;
			text-transform: uppercase;
			margin-bottom: 10px;
		}
		.quiz-question {
			font-family: 'DM Serif Display', serif;
			font-size: 32px;
			color: var(--ink);
			margin-bottom: 20px;
			line-height: 1.2;
		}
		.quiz-input {
			width: 100%;
			border: 2px solid var(--border);
			border-radius: 12px;
			padding: 12px 16px;
			font-family: 'Pretendard', sans-serif;
			font-size: 16px;
			font-weight: 600;
			color: var(--ink);
			outline: none;
			transition: border-color 0.2s;
			background: white;
		}
		.quiz-input:focus { border-color: var(--red); }
		.quiz-input.correct { border-color: #2ecc71; background: #f0fff6; color: #1a7a40; }
		.quiz-input.wrong   { border-color: #e74c3c; background: #fff5f5; color: #c0392b; }

		.quiz-feedback {
			margin-top: 10px;
			font-size: 13px;
			font-weight: 700;
			min-height: 20px;
		}
		.quiz-feedback.correct { color: #2ecc71; }
		.quiz-feedback.wrong   { color: #e74c3c; }

		.quiz-nav { display: none; }
		.quiz-card-nav {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: 14px;
		}

		/* 결과 화면 */
		.quiz-result {
			display: none;
			background: white;
			border-radius: 20px;
			padding: 40px;
			box-shadow: 0 4px 32px rgba(139,32,32,0.10);
			text-align: center;
		}
		.quiz-result.active { display: block; }
		.result-score {
			font-size: 58px;
			color: var(--red);
			line-height: 1;
			margin-bottom: 8px;
		}
		.result-label {
			font-size: 14px;
			color: var(--gray);
			font-weight: 600;
			margin-bottom: 28px;
		}
		.result-list {
			text-align: left;
			max-height: 320px;
			overflow-y: auto;
			scrollbar-width: thin;
			border: 1px solid var(--border);
			border-radius: 12px;
			margin-bottom: 20px;
		}
		.result-row {
			display: grid;
			grid-template-columns: 28px 1fr 1fr 1fr auto;
			align-items: center;
			gap: 8px;
			padding: 8px 14px;
			border-bottom: 1px solid #f0e8e0;
			font-size: 13px;
		}
		.result-row:last-child { border-bottom: none; }
		.result-row.wrong-row  { background: #fff5f5; }
		.result-row.correct-row { background: #f0fff6; }
		.r-num   { color: #999; font-weight: 700; font-size: 11px; text-align: center; }
		.r-q     { font-weight: 700; color: var(--ink); }
		.r-mine  { color: #555; }
		.r-ans   { color: #2e7d32; font-weight: 600; }
		.r-icon  { font-size: 16px; text-align: center; }

		@media screen and (max-width: 800px) {
			.quiz-wrap { width: 100%; padding: 14px 12px 40px; }
			.quiz-card { padding: 24px 20px 20px; border-radius: 16px; }
			.quiz-question { font-size: 24px; }
			.result-score { font-size: 56px; }
			.result-row { grid-template-columns: 24px 1fr 1fr auto; font-size: 12px; }
	
		}
	
		/* ── 토스트 ── */
		.toast {
			position: fixed;
			top: 24px;
			left: 50%;
			transform: translateX(-50%) translateY(-20px);
			background: var(--ink);
			color: white;
			font-size: 13px;
			font-weight: 600;
			padding: 10px 20px;
			border-radius: 99px;
			opacity: 0;
			transition: all 0.25s ease;
			pointer-events: none;
			z-index: 9999;
			white-space: nowrap;
		}
		.toast.show {
			opacity: 1;
			transform: translateX(-50%) translateY(0);
		}
	</style>
</head>

<body>

<!-- ── DAY 선택 모달 ── -->
<div id="dayModal" class="modal">
	<div class="modal-box" style="width:620px;">
		<div class="modal-title">DAY 선택</div>
		<div style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;">
			<button class="btn btn-ghost" onclick="selectRange(1,10)"  style="font-size:11px;padding:4px 10px;">1–10</button>
			<button class="btn btn-ghost" onclick="selectRange(11,20)" style="font-size:11px;padding:4px 10px;">11–20</button>
			<button class="btn btn-ghost" onclick="selectRange(21,30)" style="font-size:11px;padding:4px 10px;">21–30</button>
			<button class="btn btn-ghost" onclick="selectRange(31,40)" style="font-size:11px;padding:4px 10px;">31–40</button>
			<button class="btn btn-ghost" onclick="selectRange(41,50)" style="font-size:11px;padding:4px 10px;">41–50</button>
			<button class="btn btn-ghost" onclick="selectAll()"        style="font-size:11px;padding:4px 10px;">전체</button>
			<button class="btn btn-ghost" onclick="clearAll()"         style="font-size:11px;padding:4px 10px;">초기화</button>
		</div>
		<div class="day-grid" id="day-items-container"></div>
		<div class="modal-actions">
			<button class="btn btn-primary" onclick="requestDays()">확인</button>
			<button class="btn btn-ghost"   onclick="hideModal()">취소</button>
		</div>
	</div>
</div>

<!-- ── 자세히보기 모달 ── -->
<div id="detailModal" class="modal">
	<div class="modal-box" style="width:82%;">
		<div class="modal-title">단어 전체 목록</div>
		<!-- PC 테이블 -->
		<table class="detail-table">
			<thead>
				<tr>
					<th style="width:5%">번호</th>
					<th style="width:8%">DAY</th>
					<th style="width:35%">단어</th>
					<th style="width:35%">뜻</th>
					<th style="width:7%">유형</th>
				</tr>
			</thead>
			<tbody id="detailTableBody"></tbody>
		</table>

<div style="height:40px"></div>

<script>
/* ═══════════════════════════════
   전역 상태
═══════════════════════════════ */
let selected        = [];
let currentVocabList = [];
let displayList     = [];
let direction       = 'en-ko';
let typeFilter      = 'all';
let viewMode        = 'student';

const selectedDaysDiv = document.getElementById('selected-days');
const modal           = document.getElementById('dayModal');
const statusDot       = document.getElementById('statusDot');
const statusText      = document.getElementById('statusText');

/* ═══════════════════════════════
   DAY 버튼
═══════════════════════════════ */
const container = document.getElementById('day-items-container');
for (let d = 1; d <= 50; d++) {
	const div = document.createElement('div');
	div.className = 'day-item';
	div.dataset.value = d;
	div.innerHTML = `<span class="day-num">${d}</span><span class="day-label">DAY</span>`;
	div.addEventListener('click', () => toggleDay(div, d));
	container.appendChild(div);
}

function toggleDay(el, val) {
	if (selected.includes(val)) {
		selected = selected.filter(v => v !== val);
		el.classList.remove('selected');
	} else {
		selected.push(val);
		el.classList.add('selected');
	}
	updateDayLabel();
}

function updateDayLabel() {
	if (!selected.length) { selectedDaysDiv.textContent = 'Day'; return; }
	const s = selected.slice().sort((a, b) => a - b);
	selectedDaysDiv.textContent = `Day ${s[0]} ~ ${s[s.length-1]}`;
}

function selectRange(from, to) {
	for (let d = from; d <= to; d++) {
		if (!selected.includes(d)) {
			selected.push(d);
			document.querySelector(`.day-item[data-value="${d}"]`)?.classList.add('selected');
		}
	}
	updateDayLabel();
}
function selectAll() { selectRange(1, 50); }
function clearAll() {
	selected = [];
	document.querySelectorAll('.day-item').forEach(el => el.classList.remove('selected'));
	updateDayLabel();
}

/* ═══════════════════════════════
   모달
═══════════════════════════════ */
function showModal()       { modal.classList.add('open'); }
function hideModal()       { modal.classList.remove('open'); }
function showDetailModal() {
	if (!currentVocabList.length) return showToast('먼저 DAY 조회를 해주세요');
	renderDetailTable(currentVocabList);
	document.getElementById('detailModal').classList.add('open');
}
function hideDetailModal() { document.getElementById('detailModal').classList.remove('open'); }

document.querySelectorAll('.modal').forEach(m => {
	m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

/* ═══════════════════════════════
   세그먼트
═══════════════════════════════ */
function setDir(btn) {
	document.querySelectorAll('#dirSeg .seg-btn').forEach(b => b.classList.remove('active'));
	btn.classList.add('active');
	direction = btn.dataset.dir;
	applyAndRender();
}

function setType(btn) {
	document.querySelectorAll('#typeSeg .seg-btn').forEach(b => b.classList.remove('active'));
	btn.classList.add('active');
	typeFilter = btn.dataset.type;
	if (selected.length) requestDays(false);
}

/* ═══════════════════════════════
   방향 적용 & 렌더
═══════════════════════════════ */
function applyAndRender() {
	if (!currentVocabList.length) return;
	let list = currentVocabList.map(w => ({ ...w }));
	list = list.map(w => {
		let dir = direction;
		if (dir === 'random') dir = Math.random() < 0.5 ? 'en-ko' : 'ko-en';
		if (dir === 'ko-en') return { ...w, vocab: w.meaning, meaning: w.vocab };
		return { ...w };
	});
	displayList = list;
	renderVocabTables(displayList);
}

/* ═══════════════════════════════
   시험지 렌더
═══════════════════════════════ */
function makeRow(w) {
	const tr  = document.createElement('tr');
	const td1 = document.createElement('td');
	td1.textContent = '';
	const td2 = document.createElement('td');
	td2.className = 'vocab';
	td2.textContent = w ? w.vocab : '';
	td2.contentEditable = true;
	if (w) td2.onblur = () => w.vocab = td2.textContent;
	const td3 = document.createElement('td');
	td3.className = 'answer';
	td3.textContent = w ? w.meaning : '';
	td3.contentEditable = true;
	if (w) td3.onblur = () => w.meaning = td3.textContent;
	tr.append(td1, td2, td3);
	return tr;
}

function renderVocabTables(vocabList) {
	const lb = document.getElementById('leftTableBody');
	const rb = document.getElementById('rightTableBody');
	lb.innerHTML = '';
	rb.innerHTML = '';
	const items = vocabList.slice(0, 40);
	for (let i = 0;  i < 20; i++) lb.appendChild(makeRow(items[i] ?? null));
	for (let i = 20; i < 40; i++) rb.appendChild(makeRow(items[i] ?? null));
	applyViewMode();
}

/* ═══════════════════════════════
   서버 조회
═══════════════════════════════ */
function requestDays(closeModal = true) {
	if (!selected.length) return showToast('선택된 DAY가 없습니다!');
	setStatus('loading', '불러오는 중…');
	fetch('/testForm/submitDays2', {
		method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({ days: selected, type: typeFilter })
	})
	.then(r => r.json())
	.then(result => {
		if (closeModal) hideModal();
		if (result.result) {
			currentVocabList = result.result;
			setStatus('ok', `${currentVocabList.length}개 로드`);
			applyAndRender();
		}
	})
	.catch(() => setStatus('err', '오류 발생'));
}

function setStatus(state, msg) {
	statusText.textContent = msg;
	statusDot.className = 'status-dot' + (state === 'ok' ? ' active' : '');
}

document.getElementById('refreshBtn').addEventListener('click', () => {
	if (!selected.length) return showToast('먼저 DAY를 선택해주세요!');
	requestDays(false);
});

/* ═══════════════════════════════
   자세히보기 렌더
═══════════════════════════════ */
function renderDetailTable(list) {
	const isMobile = window.innerWidth <= 800;

	// PC 테이블
	const tbody = document.getElementById('detailTableBody');
	tbody.innerHTML = '';
	list.forEach((w, i) => {
		const tr = document.createElement('tr');
		tr.innerHTML = `
			<td>${i+1}</td>
			<td contenteditable="true" class="ed">${w.day ?? ''}</td>
			<td contenteditable="true" class="ev">${w.vocab ?? ''}</td>
			<td contenteditable="true" class="em">${w.meaning ?? ''}</td>
			<td contenteditable="true" class="et">${w.type ?? ''}</td>
		`;
		tr.querySelector('.ed').oninput = e => { w.day     = e.target.innerText; applyAndRender(); };
		tr.querySelector('.ev').oninput = e => { w.vocab   = e.target.innerText; applyAndRender(); };
		tr.querySelector('.em').oninput = e => { w.meaning = e.target.innerText; applyAndRender(); };
		tr.querySelector('.et').oninput = e => { w.type    = e.target.innerText; };
		tbody.appendChild(tr);
	});

	// 모바일 카드
	const cardList = document.getElementById('detailCardList');
	cardList.innerHTML = '';
	if (isMobile) {
		list.forEach((w, i) => {
			const card = document.createElement('div');
			card.className = 'detail-card';
			card.innerHTML = `
				<span class="dc-num">${i+1}</span>
				<span class="dc-vocab"   contenteditable="true">${w.vocab ?? ''}</span>
				<span class="dc-meaning" contenteditable="true">${w.meaning ?? ''}</span>
				<span class="dc-type">${w.type ?? ''}</span>
			`;
			card.querySelector('.dc-vocab').oninput   = e => { w.vocab   = e.target.innerText; applyAndRender(); };
			card.querySelector('.dc-meaning').oninput = e => { w.meaning = e.target.innerText; applyAndRender(); };
			cardList.appendChild(card);
		});
	}
}

/* ═══════════════════════════════
   보기 모드
═══════════════════════════════ */
function applyViewMode() {
	const hidden = viewMode === 'student';
	document.querySelectorAll('.answer').forEach(el => el.style.visibility = hidden ? 'hidden' : 'visible');
}
function forStudent() {
	viewMode = 'student';
	document.getElementById('btnStudent').classList.add('active');
	document.getElementById('btnTeacher').classList.remove('active');
	applyViewMode();
}
function forTeacher() {
	viewMode = 'teacher';
	document.getElementById('btnTeacher').classList.add('active');
	document.getElementById('btnStudent').classList.remove('active');
	applyViewMode();
}



/* ═══════════════════════════════
   모바일 용지 스케일
═══════════════════════════════ */
function scalePaper() {
	const paper = document.querySelector('.paper');
	const wrap  = document.querySelector('.paper-wrap');
	if (!paper || !wrap) return;
	const ww = wrap.clientWidth;
	const pw = paper.scrollWidth;
	if (ww > 0 && ww < pw) {
		const s = ww / pw;
		paper.style.transform       = `scale(${s})`;
		paper.style.transformOrigin = 'top left';
		wrap.style.height           = (paper.scrollHeight * s) + 'px';
	} else {
		paper.style.transform       = '';
		paper.style.transformOrigin = '';
		if (wrap) wrap.style.height = '';
	}
}
window.addEventListener('resize', scalePaper);
window.addEventListener('load',   scalePaper);
scalePaper();

/* ═══════════════════════════════
   PDF 렌더
═══════════════════════════════ */
pdfjsLib.getDocument("/testForm.pdf").promise.then(pdf => {
	pdf.getPage(1).then(page => {
		const vp = page.getViewport({ scale: 2 });
		const canvas = document.getElementById("pdfCanvas");
		canvas.width  = vp.width;
		canvas.height = vp.height;
		page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
	});
}).catch(() => {});


/* ═══════════════════════════════
   시험 모드
═══════════════════════════════ */
let quizList    = [];   // 출제 목록
let quizIdx     = 0;    // 현재 문제 인덱스
let userAnswers = [];   // 사용자 답안 배열
let quizChecked = [];   // 채점 여부 배열

function startQuiz() {
	if (!currentVocabList.length) return showToast('먼저 DAY 조회를 해주세요');

	// 시험 데이터 준비 (방향 적용)
	quizList = currentVocabList.map(w => {
		let dir = direction;
		if (dir === 'random') dir = Math.random() < 0.5 ? 'en-ko' : 'ko-en';
		return {
			question: dir === 'ko-en' ? w.meaning : w.vocab,
			answer:   dir === 'ko-en' ? w.vocab   : w.meaning,
			dir,
			raw: w
		};
	}).slice(0, 40);

	quizIdx     = 0;
	userAnswers = new Array(quizList.length).fill('');
	quizChecked = new Array(quizList.length).fill(false);

	// 모달 열기
	document.getElementById('quizModal').classList.add('open');
	document.getElementById('quizResult').classList.remove('active');
	document.getElementById('quizCardArea').style.display = '';

	renderQuizCard();
}

function exitQuiz() {
	document.getElementById('quizModal').classList.remove('open');
}

function renderQuizCard() {
	const total = quizList.length;
	const q     = quizList[quizIdx];

	// 진행바
	document.getElementById('quizProgressBar').style.width = ((quizIdx / total) * 100) + '%';
	document.getElementById('quizCount').textContent = `${quizIdx + 1} / ${total}`;



	const area = document.getElementById('quizCardArea');
	area.innerHTML = '';

	const card = document.createElement('div');
	card.className = 'quiz-card';

	const dirLabel = q.dir === 'ko-en' ? '한 → 영' : '영 → 한';
	const isLast = quizIdx === quizList.length - 1;
	card.innerHTML = `
		<div class="quiz-question-label">${dirLabel} &nbsp;·&nbsp; ${quizIdx + 1}번</div>
		<div class="quiz-question">${escHtml(q.question)}</div>
		<input class="quiz-input" id="quizInput" type="text"
			placeholder="${q.dir === 'ko-en' ? '영어 단어를 입력하세요' : '한글 뜻을 입력하세요'}"
			value="${escHtml(userAnswers[quizIdx])}"
			autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
		<div class="quiz-feedback" id="quizFeedback"></div>
		<div class="quiz-card-nav" id="quizCardNav">
			${quizIdx > 0 ? '<button class="btn btn-ghost" onclick="quizPrev()" style="font-size:12px;padding:8px 14px;">◀ 이전</button>' : '<span></span>'}
			<button class="btn btn-primary" id="btnCardAction" style="font-size:12px;padding:8px 18px;">
				${isLast ? '채점하기' : '확인'}
			</button>
		</div>
	`;
	area.appendChild(card);

	const input = document.getElementById('quizInput');
	input.focus();

	// 카드 안 버튼 이벤트
	const btnAction = document.getElementById('btnCardAction');
	if (btnAction) {
		btnAction.addEventListener('click', () => {
			if (!quizChecked[quizIdx]) {
				checkCurrentAnswer();
			} else {
				const isLast = quizIdx === quizList.length - 1;
				if (isLast) submitQuiz();
				else quizNext();
			}
		});
	}

	// 이미 채점된 경우 피드백 표시
	if (quizChecked[quizIdx]) showFeedback(q, userAnswers[quizIdx], false);

	// Enter → 다음
	// 이미 채점된 경우 input 잠금
	if (userAnswers[quizIdx] && quizChecked[quizIdx]) {
		input.disabled = true;
	}

	input.addEventListener('keydown', e => {
		if (e.key === 'Enter') {
			e.preventDefault();
			if (!quizChecked[quizIdx]) {
				checkCurrentAnswer();
			} else {
				if (quizIdx < quizList.length - 1) quizNext();
				else submitQuiz();
			}
		}
	});
	input.addEventListener('input', () => {
		userAnswers[quizIdx] = input.value;
	});
}

function saveAnswer() {
	const input = document.getElementById('quizInput');
	if (input) userAnswers[quizIdx] = input.value;
}

function quizNext() {
	if (!quizChecked[quizIdx]) { checkCurrentAnswer(); return; }
	saveAnswer();
	if (quizIdx < quizList.length - 1) { quizIdx++; renderQuizCard(); }
}
function quizPrev() {
	if (quizIdx > 0) { quizIdx--; renderQuizCard(); }
}

function checkCurrentAnswer() {
	const input = document.getElementById('quizInput');
	if (!input) return;
	const ua = input.value.trim();
	if (!ua) {
		showToast('답을 입력해주세요');
		input.focus();
		return;
	}
	userAnswers[quizIdx] = ua;
	quizChecked[quizIdx] = true;

	const q  = quizList[quizIdx];
	const ok = isCorrect(q, ua);

	// input 스타일
	input.className = 'quiz-input ' + (ok ? 'correct' : 'wrong');
	input.disabled  = true;

	// 피드백
	const fb = document.getElementById('quizFeedback');
	fb.className = 'quiz-feedback ' + (ok ? 'correct' : 'wrong');
	fb.innerHTML = `${ok ? '✓ 정답!' : '✗ 오답'} &nbsp;—&nbsp; <span style="color:#2e7d32;font-weight:800;">정답: ${escHtml(q.answer)}</span>`;

	// 카드 색상
	const card = document.querySelector('.quiz-card');
	if (card) card.classList.add(ok ? 'correct' : 'wrong');

	// 카드 내 버튼 텍스트 업데이트
	const btnAction = document.getElementById('btnCardAction');
	if (btnAction) {
		const isLast = quizIdx === quizList.length - 1;
		btnAction.textContent = isLast ? '채점하기' : '다음 ▶';
	}
}

function isCorrect(q, userAns) {
	const ua = userAns.trim();
	if (!ua) return false;

	if (q.dir === 'ko-en') {
		// 영어: 완전 일치 (대소문자 무시)
		return ua.toLowerCase() === q.answer.trim().toLowerCase();
	} else {
		// 한국어: , / · 로 분리한 각 뜻과 완전 일치해야 정답
		const answers = q.answer.split(/[,，·\/]/).map(s => s.trim()).filter(Boolean);
		return answers.some(a => ua === a);
	}
}

function showFeedback(q, userAns, animate = true) {
	const fb    = document.getElementById('quizFeedback');
	const input = document.getElementById('quizInput');
	if (!fb || !input) return;

	if (!userAns.trim()) { fb.textContent = ''; return; }

	const ok = isCorrect(q, userAns);
	fb.className    = 'quiz-feedback ' + (ok ? 'correct' : 'wrong');
	input.className = 'quiz-input '    + (ok ? 'correct' : 'wrong');

	if (ok) {
		fb.textContent = '✓ 정답!';
	} else {
		fb.textContent = `✗ 오답 — 정답: ${q.answer}`;
	}
}

function submitQuiz() {
	if (!quizChecked[quizIdx]) { checkCurrentAnswer(); return; }
	saveAnswer();

	let correct = 0;
	quizList.forEach((q, i) => {
		if (isCorrect(q, userAnswers[i] || '')) correct++;
	});

	const total   = quizList.length;
	const score   = Math.round((correct / total) * 100);

	document.getElementById('quizCardArea').style.display  = 'none';
	document.getElementById('quizProgressBar').style.width = '100%';
	document.getElementById('quizCount').textContent       = `${correct} / ${total} 정답`;

	document.getElementById('resultScore').textContent = score + '점';
	document.getElementById('resultLabel').textContent = `${correct} / ${total}`;

	// 결과 리스트
	const list = document.getElementById('resultList');
	list.innerHTML = '';
	quizList.forEach((q, i) => {
		const ua  = userAnswers[i] || '';
		const ok  = isCorrect(q, ua);
		const row = document.createElement('div');
		row.className = 'result-row ' + (ok ? 'correct-row' : 'wrong-row');
		row.innerHTML = `
			<span class="r-num">${i+1}</span>
			<span class="r-q">${escHtml(q.question)}</span>
			<span class="r-mine">${escHtml(ua) || '(미입력)'}</span>
			<span class="r-ans">${escHtml(q.answer)}</span>
			<span class="r-icon">${ok ? '✓' : '✗'}</span>
		`;
		list.appendChild(row);
	});

	document.getElementById('quizResult').classList.add('active');
}

function showToast(msg) {
	const t = document.getElementById('toast');
	t.textContent = msg;
	t.classList.add('show');
	clearTimeout(t._timer);
	t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function escHtml(str) {
	return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════
   붙여넣기 스타일 제거
═══════════════════════════════ */
document.addEventListener('paste', function(e) {
	if (!e.target.isContentEditable) return;
	e.preventDefault();
	let text = (e.clipboardData || window.clipboardData).getData('text/plain');
	text = text.replace(/\r\n/g, '\n');
	const sel = window.getSelection();
	if (!sel.rangeCount) return;
	sel.deleteFromDocument();
	sel.getRangeAt(0).insertNode(document.createTextNode(text));
	sel.collapseToEnd();
});
</script>
